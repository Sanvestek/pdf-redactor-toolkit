name: Build Windows demo exe

on:
  push:
    branches: [exe]
    paths:
      - "redactor_webui.py"
      - "redact_pymupdf_fast.py"
      - "extract_names.py"
      - "common_english_words.txt"
      - "name_exceptions.txt"
      - "static/**"
      - "requirements.txt"
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # spaCy (used for name extraction) doesn't support 3.14 yet - see README.
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/pdf_redactor.spec --noconfirm --clean

      - name: Add demo instructions to the bundle
        run: Copy-Item packaging/DEMO_README.txt "dist/PDF Redactor/DEMO_README.txt"

      - name: Zip the portable bundle
        run: Compress-Archive -Path "dist/PDF Redactor" -DestinationPath "PDF-Redactor-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Redactor-windows
          path: PDF-Redactor-windows.zip
          retention-days: 30
